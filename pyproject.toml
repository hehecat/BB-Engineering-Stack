[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bb-engineering-stack"
version = "0.11.0"
description = "Portable Claude Code workflow for Web security and browser JavaScript analysis"
requires-python = ">=3.11"
dependencies = [
  "jsonschema[format]>=4.18,<5",
  "PyYAML>=6,<7"
]

[project.scripts]
bb-stack = "bb_stack.cli:main"

[tool.setuptools]
package-dir = {"" = "00-L0-Runtime/lib"}

[tool.setuptools.packages.find]
where = ["00-L0-Runtime/lib"]

[tool.ruff.lint.per-file-ignores]
"99-Verification/scripts/test_*.py" = ["E402"]
