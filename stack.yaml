schema_version: 1
name: bb-engineering-stack
version_file: VERSION
minimum_runtime:
  python: "3.11"
  node: "22"
  claude_code: "2.1"

# Layer directories relative to this file. `runtime` and `global_prompt` are
# read by the runtime and Prompt renderer. The remaining entries name layers
# whose modules still hard-code their own location; they are the declared
# source of truth for those lookups and must be kept in step with them.
paths:
  runtime: .runtime
  global_prompt: 01-L1-Global-Prompt
  workflow_profiles: 02-L2-Workflow-Profiles
  engagement_state: 03-L3-Engagement-State
  skills: 04-L4-Skills
  capabilities: 05-L5-MCP-CLI
  docs: 90-Docs
  verification: 99-Verification

defaults:
  # Default L2 runtime Profile (`bb-stack launch`, `bb-stack eval agent`). The
  # CLI default L5 capability Profile is the unique capability_profiles entry
  # that selects this profile, so both axes stay consistent by construction.
  profile: ctf-quick
  workflow_profiles:
    bug-bounty: bb-interactive
    assessment: assessment-web
    ctf: ctf-quick
    lab: lab-replacement
    analysis: browser-js
  capability_profiles:
    minimal: lab-replacement
    ctf-web: ctf-quick
    web: bb-interactive
    android: ctf-android
    reverse: ctf-reverse
    browser-js: browser-js
    assessment-web: assessment-web
    assessment-android: assessment-android
    assessment-ios: assessment-ios
    assessment-network: assessment-network
    assessment-cloud: assessment-cloud
    assessment-llm: assessment-llm
    assessment-source: assessment-source
    assessment-reverse: assessment-reverse
    analysis-android: analysis-android
    analysis-reverse: analysis-reverse
  work_root: "${HOME}/BB-Workspaces"
  config_home: "${HOME}/.config/bb-stack"
  claude_config_dir: "${HOME}/.claude"

registries:
  runtime_profiles: 02-L2-Workflow-Profiles/profiles
  platforms: 02-L2-Workflow-Profiles/platforms
  skill_manifest: 04-L4-Skills/skills.yaml
  skill_profiles: 04-L4-Skills/profiles
  capabilities: 05-L5-MCP-CLI/capabilities.yaml
  capability_profiles: 05-L5-MCP-CLI/profiles
  upstreams: 00-L0-Runtime/config/upstreams.yaml

keysmith:
  repository: https://github.com/Jia-Ethan/claude-keysmith.git
  revision: b3d8cc25331e8bbf2b9ccfdbdb658ee01f351663
  cache_dir: "${BB_CONFIG_HOME}/vendor/claude-keysmith"
