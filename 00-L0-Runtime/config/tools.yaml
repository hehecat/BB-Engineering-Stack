    revision: ca8114164361f6a296399d8160bb07d55bdc4843
    destination: "${BB_STACK_ROOT}/.runtime/tools/massdns-1.1.0"
    build: [make]
    executables: {massdns: bin/massdns}
  puredns:
    kind: go
    checks: [puredns]
