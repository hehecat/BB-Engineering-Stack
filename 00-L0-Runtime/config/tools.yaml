schema_version: 1

profiles:
  minimal:
    required: [system-base]
    # `mihomo` is intentionally not listed here: it is an externally provided
    # local service (see the installer below) that is only relevant when
    # BB_PROXY_MODE=mihomo. Bootstrap cannot install or start it, so a
    # service-kind entry in `optional` would guarantee a failed
    # `--with-optional` run under the default BB_PROXY_MODE=direct.
    optional: []
  ctf-web:
    required: [system-base, ffuf, chromium]
    optional: [httpx, katana, gau, sqlmap, interactsh-client]
  web:
    required: [system-base, subfinder, dnsx, httpx, katana, ffuf, nuclei, chromium]
    optional: [uv, bbot, assetfinder, amass, asnmap, mapcidr, alterx, massdns, puredns, gau, waybackurls, jsluice, arjun, interactsh-client, dalfox, naabu, nmap, sqlmap, semgrep, trufflehog]
  android:
    required: [system-base, java-runtime, adb, apktool, jadx]
    optional: [native-base, radare2, frida, objection]
  reverse:
    required: [system-base, native-base, radare2]
    optional: [native-debug, native-emulation, checksec, jadx, apktool]
  browser-js:
    required: [system-base, chromium]
    optional: [semgrep]
  assessment-web:
    required: [system-base, chromium]
    optional: [httpx, katana, ffuf, semgrep, interactsh-client]
  assessment-android:
    required: [system-base, java-runtime, adb, apktool, jadx]
    optional: [native-base, radare2, frida, objection]
  assessment-ios:
    required: [system-base, radare2]
    optional: [ios-device, frida, objection]
  assessment-network:
    required: [system-base, nmap]
    optional: [naabu]
  assessment-cloud:
    required: [system-base]
    optional: []
  assessment-llm:
    required: [system-base, chromium]
    optional: [interactsh-client]
  assessment-source:
    required: [system-base, semgrep]
    optional: [trufflehog]
  assessment-reverse:
    required: [system-base, native-base, radare2]
    optional: [native-debug, native-emulation, checksec]
  analysis-android:
    required: [system-base, java-runtime, apktool, jadx]
    optional: [native-base, radare2, adb, frida, objection]
  analysis-reverse:
    required: [system-base, native-base, radare2]
    optional: [native-debug, native-emulation, checksec, jadx, apktool]

installers:
  system-base:
    kind: apt
    checks: [cc, curl, jq, make, openssl, git, python3]
    packages: [build-essential, ca-certificates, curl, git, jq, openssl, python3, python3-venv, unzip]
  uv:
    kind: archive-binary
    checks: [uv]
    binary: uv
    files:
      x86_64:
        archive: uv-x86_64-unknown-linux-gnu.tar.gz
        url: https://github.com/astral-sh/uv/releases/download/0.12.21/uv-x86_64-unknown-linux-gnu.tar.gz
        sha256: 23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0
      aarch64:
        archive: uv-aarch64-unknown-linux-gnu.tar.gz
        url: https://github.com/astral-sh/uv/releases/download/0.12.21/uv-aarch64-unknown-linux-gnu.tar.gz
        sha256: 030b69227b40af8c1981b7301793dc66e71ed3c796ea8688209dd268bd91ec51
  native-base:
    kind: apt
    checks: [file, readelf, objdump, nm, strings]
    packages: [binutils, file]
  native-debug:
    kind: apt
    checks: [gdb]
    packages: [gdb]
  native-emulation:
    kind: apt
    checks: [qemu-aarch64, qemu-arm]
    packages: [qemu-user]
  checksec:
    kind: apt
    checks: [checksec]
    packages: [checksec]
  chromium:
    kind: apt
    checks: [chromium]
    packages: [chromium]
  java-runtime:
    kind: apt
    checks: [java]
    packages: [default-jre-headless]
  adb:
    kind: apt
    checks: [adb]
    packages: [adb]
  ios-device:
    kind: apt
    checks: [ideviceinstaller, iproxy]
    packages: [ideviceinstaller, libusbmuxd-tools]
  apktool:
    kind: apt
    checks: [apktool]
    packages: [apktool]
  jadx:
    kind: archive-tree
    checks: [jadx]
    format: zip
    destination: "${BB_STACK_ROOT}/.runtime/tools/jadx-1.5.6"
    executables: {jadx: bin/jadx}
    files:
      x86_64:
        archive: jadx-1.5.6.zip
        url: https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
        sha256: 545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974
      aarch64:
        archive: jadx-1.5.6.zip
        url: https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
        sha256: 545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974
  radare2:
    kind: deb
    checks: [r2]
    files:
      x86_64:
        archive: radare2_6.2.2_amd64.deb
        url: https://github.com/radareorg/radare2/releases/download/6.2.2/radare2_6.2.2_amd64.deb
        sha256: 09234e4139bf8dfcbb7fc1fdb2519859ad516e63c19d3c27d92aaecdf463b1ad
      aarch64:
        archive: radare2_6.2.2_arm64.deb
        url: https://github.com/radareorg/radare2/releases/download/6.2.2/radare2_6.2.2_arm64.deb
        sha256: 6e3ccf220e5b53adedc9dccc67825e908b545aabd4cf8723f0c43ebfd0c4f437
  sqlmap:
    kind: apt
    checks: [sqlmap]
    packages: [sqlmap]
  semgrep:
    kind: pipx
    checks: [semgrep]
    package: semgrep==1.178.0
  frida:
    kind: pipx
    checks: [frida]
    package: frida-tools==14.10.4
  objection:
    kind: pipx
    checks: [objection]
    package: objection==1.12.5
  subfinder:
    kind: go
    checks: [subfinder]
    package: github.com/projectdiscovery/subfinder/v2/cmd/subfinder@v2.16.0
  bbot:
    kind: uv-tool
    checks: [bbot]
    package: bbot==3.0.1
    python: "3.12"
  assetfinder:
    kind: go
    checks: [assetfinder]
    package: github.com/tomnomnom/assetfinder@v0.1.1
  amass:
    kind: go
    checks: [amass]
    package: github.com/owasp-amass/amass/v5/cmd/amass@v5.1.1
  asnmap:
    kind: go
    checks: [asnmap]
    package: github.com/projectdiscovery/asnmap/cmd/asnmap@v1.1.1
  mapcidr:
    kind: go
    checks: [mapcidr]
    package: github.com/projectdiscovery/mapcidr/cmd/mapcidr@v1.1.97
  alterx:
    kind: go
    checks: [alterx]
    package: github.com/projectdiscovery/alterx/cmd/alterx@v0.1.0
  massdns:
    kind: git-build
    checks: [massdns]
    repository: https://github.com/blechschmidt/massdns.git
    revision: ca8114164361f6a296399d8160bb07d55bdc4843
    destination: "${BB_STACK_ROOT}/.runtime/tools/massdns-1.1.0"
    build: [make]
    executables: {massdns: bin/massdns}
  puredns:
    kind: go
    checks: [puredns]
    package: github.com/d3mondev/puredns/v2@v2.1.1
  dnsx:
    kind: go
    checks: [dnsx]
    package: github.com/projectdiscovery/dnsx/cmd/dnsx@v1.3.1
  httpx:
    kind: go
    checks: [httpx]
    package: github.com/projectdiscovery/httpx/cmd/httpx@v1.12.0
  katana:
    kind: go
    checks: [katana]
    package: github.com/projectdiscovery/katana/cmd/katana@v1.7.0
  gau:
    kind: go
    checks: [gau]
    package: github.com/lc/gau/v2/cmd/gau@v2.2.4
  waybackurls:
    kind: go
    checks: [waybackurls]
    package: github.com/tomnomnom/waybackurls@v0.1.0
  jsluice:
    kind: go
    checks: [jsluice]
    package: github.com/BishopFox/jsluice/cmd/jsluice@0ddfab153e060a9eeaded4d8669233f7c071e7e4
  arjun:
    kind: uv-tool
    checks: [arjun]
    package: arjun==2.2.7
    python: "3.12"
  ffuf:
    kind: go
    checks: [ffuf]
    package: github.com/ffuf/ffuf/v2@v2.3.0
  nuclei:
    kind: go
    checks: [nuclei]
    package: github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.11.1
    post_install: [nuclei, -update-templates]
    post_check: "${HOME}/nuclei-templates"
  interactsh-client:
    kind: go
    checks: [interactsh-client]
    package: github.com/projectdiscovery/interactsh/cmd/interactsh-client@v1.4.0
  dalfox:
    kind: go
    checks: [dalfox]
    package: github.com/hahwul/dalfox/v2@v2.13.0
  naabu:
    kind: go
    checks: [naabu]
    package: github.com/projectdiscovery/naabu/v2/cmd/naabu@v2.6.1
  nmap:
    kind: apt
    checks: [nmap]
    packages: [nmap]
  trufflehog:
    kind: archive-binary
    checks: [trufflehog]
    binary: trufflehog
    files:
      x86_64:
        archive: trufflehog_3.97.9_linux_amd64.tar.gz
        url: https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.9/trufflehog_3.97.9_linux_amd64.tar.gz
        sha256: 40377e6572495412fb9ba0bc21c9401f73b72f1d2afd11b9931bc4a5ed622866
      aarch64:
        archive: trufflehog_3.97.9_linux_arm64.tar.gz
        url: https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.9/trufflehog_3.97.9_linux_arm64.tar.gz
        sha256: 372c568695d49e53517075b5f74d1ee9a19053f13661d689c7928ee1fc27d705
  mihomo:
    kind: service
    checks: []
    host: 127.0.0.1
    port: 7890
    # Not referenced by any profile: the service is provisioned by the user and
    # is only required when BB_PROXY_MODE=mihomo. Bootstrap verifies it but
    # never installs it.
