schema_version: 1

profiles:
  minimal:
    required: [system-base]
    optional: [mihomo]
  ctf-web:
    required: [system-base, ffuf, chromium]
    optional: [httpx, katana, gau, sqlmap, interactsh-client]
  web:
    required: [system-base, subfinder, dnsx, httpx, katana, ffuf, nuclei, chromium]
    optional: [uv, bbot, assetfinder, amass, asnmap, mapcidr, alterx, massdns, puredns, gau, waybackurls, jsluice, arjun, interactsh-client, dalfox, naabu, nmap, sqlmap, semgrep, trufflehog]
  android:
    required: [system-base, java-runtime, adb, apktool, jadx]
    optional: [native-base, radare2, frida, objection]
  reverse:
    required: [system-base, native-base, radare2]
    optional: [native-debug, native-emulation, checksec, jadx, apktool]
  browser-js:
    required: [system-base, chromium]
    optional: [semgrep]
  assessment-web:
    required: [system-base, chromium]
    optional: [httpx, katana, ffuf, semgrep, interactsh-client]
  assessment-android:
    required: [system-base, java-runtime, adb, apktool, jadx]
    optional: [native-base, radare2, frida, objection]
  assessment-ios:
    required: [system-base, radare2]
    optional: [ios-device, frida, objection]
  assessment-network:
    required: [system-base, nmap]
    optional: [naabu]
  assessment-cloud:
    required: [system-base]
    optional: []
  assessment-llm:
    required: [system-base, chromium]
    optional: [interactsh-client]
  assessment-source:
    required: [system-base, semgrep]
    optional: [trufflehog]
  assessment-reverse:
    required: [system-base, native-base, radare2]
    optional: [native-debug, native-emulation, checksec]
  analysis-android:
    required: [system-base, java-runtime, apktool, jadx]
    optional: [native-base, radare2, adb, frida, objection]
  analysis-reverse:
    required: [system-base, native-base, radare2]
    optional: [native-debug, native-emulation, checksec, jadx, apktool]

installers:
  system-base:
    kind: apt
    checks: [cc, curl, jq, make, openssl, git, python3]
    packages: [build-essential, ca-certificates, curl, git, jq, openssl, python3, python3-venv, unzip]
  uv:
    kind: archive-binary
    checks: [uv]
    binary: uv
    files:
      x86_64:
        archive: uv-x86_64-unknown-linux-gnu.tar.gz
        url: https://github.com/astral-sh/uv/releases/download/0.11.14/uv-x86_64-unknown-linux-gnu.tar.gz
        sha256: f3b623eb0e6141a7053d571d59a0bdc341e0f238ea8f5f0b4815ddbec9a2a296
      aarch64:
        archive: uv-aarch64-unknown-linux-gnu.tar.gz
        url: https://github.com/astral-sh/uv/releases/download/0.11.14/uv-aarch64-unknown-linux-gnu.tar.gz
        sha256: c4958f729e216f1610632574ed927b8cf0af1bd02cb88cb30d948571727aee43
  native-base:
    kind: apt
    checks: [file, readelf, objdump, nm, strings]
    packages: [binutils, file]
  native-debug:
    kind: apt
    checks: [gdb]
    packages: [gdb]
  native-emulation:
    kind: apt
    checks: [qemu-aarch64, qemu-arm]
    packages: [qemu-user]
  checksec:
    kind: apt
    checks: [checksec]
    packages: [checksec]
  chromium:
    kind: apt
    checks: [chromium]
    packages: [chromium]
  java-runtime:
    kind: apt
    checks: [java]
    packages: [default-jre-headless]
  adb:
    kind: apt
    checks: [adb]
    packages: [adb]
  ios-device:
    kind: apt
    checks: [ideviceinstaller, iproxy]
    packages: [ideviceinstaller, libusbmuxd-tools]
  apktool:
    kind: apt
    checks: [apktool]
    packages: [apktool]
  jadx:
    kind: archive-tree
    checks: [jadx]
    format: zip
    destination: "${BB_STACK_ROOT}/.runtime/tools/jadx-1.5.6"
    executables: {jadx: bin/jadx}
    files:
      x86_64:
        archive: jadx-1.5.6.zip
        url: https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
        sha256: 545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974
      aarch64:
        archive: jadx-1.5.6.zip
        url: https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
        sha256: 545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974
  radare2:
    kind: deb
    checks: [r2]
    files:
      x86_64:
        archive: radare2_6.1.8_amd64.deb
        url: https://github.com/radareorg/radare2/releases/download/6.1.8/radare2_6.1.8_amd64.deb
        sha256: 91e64c672e65521758c0deb0f70d98ac90f0a78eb654d8bd0d894dd5735130e3
      aarch64:
        archive: radare2_6.1.8_arm64.deb
        url: https://github.com/radareorg/radare2/releases/download/6.1.8/radare2_6.1.8_arm64.deb
        sha256: fc6717579be2ad2aaa5364aff8b134e9dd8fc0c1414a58c96659f413a2a2b750
  sqlmap:
    kind: apt
    checks: [sqlmap]
    packages: [sqlmap]
  semgrep:
    kind: pipx
    checks: [semgrep]
    package: semgrep==1.130.0
  frida:
    kind: pipx
    checks: [frida]
    package: frida-tools==14.4.5
  objection:
    kind: pipx
    checks: [objection]
    package: objection==1.11.0
  subfinder:
    kind: go
    checks: [subfinder]
    package: github.com/projectdiscovery/subfinder/v2/cmd/subfinder@v2.14.0
  bbot:
    kind: uv-tool
    checks: [bbot]
    package: bbot==3.0.1
    python: "3.12"
  assetfinder:
    kind: go
    checks: [assetfinder]
    package: github.com/tomnomnom/assetfinder@v0.1.1
  amass:
    kind: go
    checks: [amass]
