schema_version: 1

providers:
  curl:
    kind: cli
    locator: {type: command, value: curl}
    placement: main
    stateful: false
    context_cost: none
    side_effects: [network-request]

  jq:
    kind: cli
    locator: {type: command, value: jq}
    placement: main
    stateful: false
    context_cost: none
    side_effects: [local-read]

  openssl:
    kind: cli
    locator: {type: command, value: openssl}
    placement: main
    stateful: false
    context_cost: low
    side_effects: [network-request, local-read]

  project-python:
    kind: runtime
    locator: {type: path, value: "${BB_STACK_ROOT}/.runtime/venv/bin/python"}
    placement: main
    stateful: false
    context_cost: none
    side_effects: [local-read, local-write]

  pentest-python:
    kind: cli
    locator: {type: path, value: "${BB_STACK_ROOT}/.runtime/bin/pentest-python"}
    placement: main
    stateful: false
    context_cost: none
    side_effects: [local-read, local-write, network-request]
    configuration:
      required: true
      python_modules: [jwt, requests, yaml]
      python_from: "${BB_STACK_ROOT}/.runtime/venv/bin/python"

  bb-recon:
    kind: cli
    locator: {type: command, value: bb-recon}
    placement: main
    stateful: true
    context_cost: low
    side_effects: [network-request, local-read, local-write]

  bbot:
    kind: cli
    locator: {type: command, value: bbot}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [passive-network, network-request, local-write]

  subfinder:
    kind: cli
    locator: {type: command, value: subfinder}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [passive-network]
    configuration:
      required: false
      files_any: ["${HOME}/.config/subfinder/config.yaml"]

  assetfinder:
    kind: cli
    locator: {type: command, value: assetfinder}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [passive-network]

  amass:
    kind: cli
    locator: {type: command, value: amass}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [passive-network]

  asnmap:
    kind: cli
    locator: {type: command, value: asnmap}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [passive-network]

  mapcidr:
    kind: cli
    locator: {type: command, value: mapcidr}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [local-read]

  alterx:
    kind: cli
    locator: {type: command, value: alterx}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [local-read, local-write]

  puredns:
    kind: cli
    locator: {type: command, value: puredns}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [high-volume-network, local-read, local-write]

  dnsx:
    kind: cli
    locator: {type: command, value: dnsx}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [network-request]

  httpx:
    kind: cli
    locator: {type: command, value: httpx}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [network-request]

  katana:
    kind: cli
    locator: {type: command, value: katana}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [network-request]

  gau:
    kind: cli
    locator: {type: command, value: gau}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [passive-network]

  waybackurls:
    kind: cli
    locator: {type: command, value: waybackurls}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [passive-network]

  jsluice:
    kind: cli
    locator: {type: command, value: jsluice}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [network-request, local-read]

  arjun:
    kind: cli
    locator: {type: command, value: arjun}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [high-volume-network, local-write]

  ffuf:
    kind: cli
    locator: {type: command, value: ffuf}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [high-volume-network]

  feroxbuster:
    kind: cli
    locator: {type: command, value: feroxbuster}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [high-volume-network]

  dirsearch:
    kind: cli
    locator: {type: command, value: dirsearch}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [high-volume-network]

  nuclei:
    kind: cli
    locator: {type: command, value: nuclei}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [high-volume-network]
    configuration:
      required: true
      files_all: ["${HOME}/nuclei-templates"]

  interactsh:
    kind: cli
    locator: {type: command, value: interactsh-client}
    placement: main
    stateful: true
    context_cost: low
    side_effects: [external-callback, local-write]

  sqlmap:
    kind: cli
    locator: {type: command, value: sqlmap}
    placement: bounded-worker
    stateful: true
    context_cost: none
    side_effects: [high-volume-network, local-write]

  dalfox:
    kind: cli
    locator: {type: command, value: dalfox}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [high-volume-network]

  naabu:
    kind: cli
    locator: {type: command, value: naabu}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [high-volume-network]

  nmap:
    kind: cli
    locator: {type: command, value: nmap}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [high-volume-network]

  semgrep:
    kind: cli
    locator: {type: command, value: semgrep}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [local-read, local-write]

  trufflehog:
    kind: cli
    locator: {type: command, value: trufflehog}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [local-read, local-write]

  chromium:
    kind: cli
    locator: {type: command, value: chromium}
    placement: mcp-runtime
    stateful: true
    context_cost: none
    side_effects: [network-request, local-write]

  playwright-mcp:
    kind: mcp
    locator:
      type: path
      value: "${BB_STACK_ROOT}/.runtime/node_modules/@playwright/mcp/cli.js"
      interpreter: node
    placement: shared-main
    stateful: true
    context_cost: medium
    side_effects: [network-request, browser-action, local-write]
    configuration:
      required: true
      env_all: [BB_CHROMIUM_BIN]
    mcp:
      name: playwright
      transport: stdio
      command: node
      args:
        - "${BB_STACK_ROOT}/.runtime/node_modules/@playwright/mcp/cli.js"
        - --headless
        - --no-sandbox
        - --executable-path
        - "${BB_CHROMIUM_BIN}"
        - --output-mode
        - file
        - --output-dir
        - "${BB_ARTIFACT_ROOT}/browser"
        - --save-session

  chrome-devtools-cli:
    kind: cli
    locator:
      type: path
      value: "${BB_STACK_ROOT}/.runtime/node_modules/.bin/chrome-devtools"
    placement: main
    stateful: true
    context_cost: none
    side_effects: [network-request, browser-action, local-write]

  chrome-devtools-mcp:
    kind: mcp
    locator:
      type: path
      value: "${BB_STACK_ROOT}/.runtime/node_modules/chrome-devtools-mcp/build/src/bin/chrome-devtools-mcp.js"
      interpreter: node
    placement: shared-main
    stateful: true
    context_cost: medium
    side_effects: [network-request, browser-action, local-write]
    configuration:
      required: true
      env_all: [BB_BROWSER_URL]
    mcp:
      name: chrome-devtools
      transport: stdio
      command: node
      args:
        - "${BB_STACK_ROOT}/.runtime/node_modules/chrome-devtools-mcp/build/src/bin/chrome-devtools-mcp.js"
        - "--browser-url=${BB_BROWSER_URL}"
        - --category-performance=false
        - --performance-crux=false
        - --usage-statistics=false
        - --screenshot-format=webp
        - --screenshot-max-width=1600

  webcrack:
    kind: cli
    locator:
      type: path
      value: "${BB_STACK_ROOT}/.runtime/node_modules/.bin/webcrack"
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [local-read, local-write, process-execution]

  anastasis-mcp:
    kind: mcp
    locator:
      type: path
      value: "${BB_STACK_ROOT}/.runtime/node_modules/anastasis-mcp-server/dist/index.js"
      interpreter: node
    placement: subagent-inline
    stateful: false
    context_cost: high
    side_effects: [network-request, local-read, local-write]
    mcp:
      name: anastasis
      transport: stdio
      command: node
      args: ["${BB_STACK_ROOT}/.runtime/node_modules/anastasis-mcp-server/dist/index.js"]

  osint-mcp:
    kind: mcp
    locator:
      type: path
      value: "${BB_STACK_ROOT}/.runtime/node_modules/osint-mcp-server/dist/index.js"
      interpreter: node
    placement: subagent-inline
    stateful: false
    context_cost: high
    side_effects: [passive-network, local-write]
    mcp:
      name: osint
      transport: stdio
      command: node
      args: ["${BB_STACK_ROOT}/.runtime/node_modules/osint-mcp-server/dist/index.js"]

  mihomo-http:
    kind: service
    locator: {type: tcp, host: 127.0.0.1, port: 7890}
    placement: runtime
    stateful: true
    context_cost: none
    side_effects: [network-routing]

  mail-otp:
    kind: cli
    locator: {type: command, value: mail-otp}
    placement: main
    stateful: true
    context_cost: low
    side_effects: [mailbox-read, local-read]
    configuration:
      required: true
      files_all: ["${HOME}/.local/share/pentest-mail/config.env"]

  filecodebox:
    kind: cli
    locator: {type: command, value: filecodebox-upload}
    placement: main
    stateful: false
    context_cost: none
    side_effects: [external-upload]
    configuration:
      required: true
      env_all: [BB_FILECODEBOX_URL]

  seclists-web:
    kind: data
    locator: {type: path, value: "${BB_DATA_ROOT}/seclists/Discovery/Web-Content/common.txt"}
    placement: runtime
    stateful: false
    context_cost: none
    side_effects: [local-read]

  seclists-dns:
    kind: data
    locator: {type: path, value: "${BB_DATA_ROOT}/seclists/Discovery/DNS/README.md"}
    placement: runtime
    stateful: false
    context_cost: none
    side_effects: [local-read]

  seclists-fuzzing:
    kind: data
    locator: {type: path, value: "${BB_DATA_ROOT}/seclists/Fuzzing/LFI/LFI-Jhaddix.txt"}
    placement: runtime
    stateful: false
    context_cost: none
    side_effects: [local-read]
    configuration:
      required: true
      files_all: ["${BB_DATA_ROOT}/seclists/Fuzzing/XSS/README.md"]

  seclists-credentials:
    kind: data
    locator: {type: path, value: "${BB_DATA_ROOT}/seclists/Passwords/Common-Credentials/10k-most-common.txt"}
    placement: runtime
    stateful: false
    context_cost: none
    side_effects: [local-read]

  seclists-usernames:
    kind: data
    locator: {type: path, value: "${BB_DATA_ROOT}/seclists/Usernames/top-usernames-shortlist.txt"}
    placement: runtime
    stateful: false
    context_cost: none
    side_effects: [local-read]

  seclists-llm:
    kind: data
    locator: {type: path, value: "${BB_DATA_ROOT}/seclists/Ai/LLM_Testing/README.md"}
    placement: runtime
    stateful: false
    context_cost: none
    side_effects: [local-read]

  payloads-web:
    kind: data
    locator: {type: path, value: "${BB_DATA_ROOT}/payloads-all-the-things/Server Side Request Forgery/README.md"}
    placement: runtime
    stateful: false
    context_cost: none
    side_effects: [local-read]
    configuration:
      required: true
      files_all:
        - "${BB_DATA_ROOT}/payloads-all-the-things/SQL Injection/README.md"
        - "${BB_DATA_ROOT}/payloads-all-the-things/XSS Injection/README.md"

  trickest-recon:
    kind: data
    locator: {type: path, value: "${BB_DATA_ROOT}/trickest-wordlists/technologies/tomcat.txt"}
    placement: runtime
    stateful: false
    context_cost: none
    side_effects: [local-read]
    configuration:
      required: true
      files_all:
        - "${BB_DATA_ROOT}/trickest-wordlists/cloud/subdomains.txt"
        - "${BB_DATA_ROOT}/trickest-wordlists/inventory/subdomains.txt"
        - "${BB_DATA_ROOT}/trickest-wordlists/robots/top-100.txt"

  gf-patterns:
    kind: data
    locator: {type: path, value: "${HOME}/.gf"}
    placement: runtime
    stateful: false
    context_cost: none
    side_effects: [local-read]

  adb:
    kind: cli
    locator: {type: command, value: adb}
    placement: main
    stateful: true
    context_cost: none
    side_effects: [device-read, device-write]

  apktool:
    kind: cli
    locator: {type: command, value: apktool}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [local-read, local-write]

  jadx:
    kind: cli
    locator: {type: command, value: jadx}
    placement: bounded-worker
    stateful: false
    context_cost: none
    side_effects: [local-read, local-write]

  frida:
