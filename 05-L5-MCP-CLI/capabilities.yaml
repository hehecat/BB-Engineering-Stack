    stateful: true
    context_cost: medium
    side_effects: [local-read, local-write, process-execution]

  qemu-user:
    kind: cli
    locator: {type: command, value: qemu-aarch64}
    placement: bounded-worker
    stateful: true
    context_cost: medium
    side_effects: [local-read, local-write, process-execution]

  ghidra-headless:
    kind: cli
    locator: {type: command, value: analyzeHeadless}
    placement: bounded-worker
    stateful: true
    context_cost: high
    side_effects: [local-read, local-write, process-execution]

  unzip:
    kind: cli
    locator: {type: command, value: unzip}
    placement: main
    stateful: false
    context_cost: none
    side_effects: [local-read, local-write]

  ideviceinstaller:
